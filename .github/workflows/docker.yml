name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v26.9.4)"
        required: true
        default: "v26.9.4.0"
      push:
        description: "Also push to Docker Hub & GHCR?"
        required: false
        default: "true"

env:
  DOCKER_IMAGE: jackge12345/dbcheck
  GHCR_IMAGE: ghcr.io/fiyo/dbcheck
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    # 临时屏蔽：与 build-release.yml 的 Linux 构建一并停用（Docker 镜像构建在 Linux 阶段同样受
    # Pillow/JPype1 源码编译缺 jpeg 等系统库影响）。恢复时删除下面这行 `if: false` 即可重新启用。
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      # ── Login to Docker Hub ────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Login to GitHub Container Registry ─────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION_NUM="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION} (num: ${VERSION_NUM})"

      # ── Build & push (multi-arch, dual registry) ──
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version_num }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version_num }}
          labels: |
            org.opencontainers.image.title=RaccoonX
            org.opencontainers.image.description=Database Intelligent Inspection Tool
            org.opencontainers.image.source=https://github.com/fiyo/DBCheck
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Image digest
        run: |
          echo "✅ Docker Hub  : ${{ env.DOCKER_IMAGE }}:latest"
          echo "✅ Docker Hub  : ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version_num }}"
          echo "✅ GHCR        : ${{ env.GHCR_IMAGE }}:latest"
          echo "✅ GHCR        : ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version_num }}"

      # ── Make GHCR package public ────────────────────
      - name: Set GHCR package visibility to public
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /users/${{ github.repository_owner }}/packages/container/dbcheck \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Generate release notes ─────────────────────
      - name: Generate release notes
        id: notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "📝 Generating notes from $PREV_TAG to HEAD"
            NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          else
            echo "📝 No previous tag, using last 20 commits"
            NOTES=$(git log --pretty=format:"- %s" -20)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- Maintenance release"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── Create GitHub Release ───────────────────────
      - name: Create GitHub Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: RaccoonX ${{ steps.version.outputs.version }}
          body: |
            ## What's Changed
            ${{ steps.notes.outputs.notes }}

            ## Docker Images

            ### Docker Hub
            ```bash
            docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version_num }}
            docker run -d -p 5003:5003 \
              -v dbcheck_data:/app/data \
              -v dbcheck_reports:/app/data/reports \
              ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version_num }}
            ```

            ### GitHub Container Registry (China-friendly)
            ```bash
            docker pull ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version_num }}
            docker run -d -p 5003:5003 \
              -v dbcheck_data:/app/data \
              -v dbcheck_reports:/app/data/reports \
              ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version_num }}
            ```

            See [README](https://github.com/fiyo/DBCheck#docker-quick-start-recommended) for full usage.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
