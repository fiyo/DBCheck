name: Try Linux arm64 Binary (no release)

# 试跑专用：验证 GitHub 原生 arm64 runner + manylinux_2_28_aarch64 容器能否
# 装齐 python3.11(shared) / JDK11 / unixODBC，并用同一套 build_linux.sh 产出
# RaccoonX-Linux-aarch64-<version>.tar.gz，且 ELF Machine 为 AArch64。
# 不挂 Release、不参与 tag 出包链路；验证通过后再并入 build-release.yml。
# 触发：GitHub Actions -> Try Linux arm64 Binary -> Run workflow
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / commit to build (default: main)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  PY_VERSION: "3.11"
  DBCHECK_CI_LENIENT: "1"

jobs:
  build-linux-arm64:
    name: Build Linux aarch64 (manylinux_2_28 / glibc 2.28)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Host arch / docker sanity
        run: |
          uname -m
          docker info --format "{{.Architecture}}" || true

      - name: Build in manylinux_2_28_aarch64 container
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src \
            -e DBCHECK_CI_LENIENT=1 \
            quay.io/pypa/manylinux_2_28_aarch64 bash -c '
            set -e
            echo "=== target arch / glibc baseline ==="
            uname -m
            ldd --version | head -1 || true
            # EL8 aarch64 软件源是本次试跑的主要不确定点：需确认能装到
            # 系统 python3.11（shared build）+ JDK11 + unixODBC(libodbc.so.2)。
            dnf install -y --setopt=install_weak_deps=False \
                java-11-openjdk-headless java-11-openjdk-devel \
                gcc gcc-c++ make libffi-devel openssl-devel \
                python3.11 python3.11-devel \
                unixODBC unixODBC-devel \
              || dnf --enablerepo="*" install -y --setopt=install_weak_deps=False \
                java-11-openjdk-headless java-11-openjdk-devel \
                gcc gcc-c++ make libffi-devel openssl-devel \
                python3.11 python3.11-devel unixODBC unixODBC-devel
            dnf install -y python3.11-pip 2>&1 || echo "[warn] python3.11-pip unavailable; venv ensurepip will be used"
            ln -sf /usr/bin/python3.11 /usr/local/bin/python3
            export LD_LIBRARY_PATH="/usr/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            python3 --version
            python3 -m sysconfig | grep -E "LIBDIR|LDLIBRARY|Py_ENABLE_SHARED" || true
            echo "=== shared libpython / unixODBC / JDK ==="
            ls -l /usr/lib64/libpython3.11.so* \
              || { echo "::error::libpython3.11.so missing; PyInstaller needs a shared Python on aarch64"; exit 1; }
            ldconfig -p | grep -E "libodbc.so|libpython3.11" || echo "[warn] ldconfig did not list expected libs"
            export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
            export PATH="$JAVA_HOME/bin:$PATH"
            java -version
            python3 -m pip install --upgrade pip setuptools wheel --timeout 120 --retries 10 \
              2>&1 || echo "[warn] system pip unavailable, venv will bootstrap pip"
            dnf install -y libjpeg-turbo-devel zlib-devel libpng-devel freetype-devel \
                2>&1 || echo "[warn] optional image devel libs unavailable"
            python3 build/ci_prepare.py
            bash build/build_linux.sh 2>&1 | tee build-linux-arm64.log
            RC=${PIPESTATUS[0]}
            chmod -R a+rwX /src/dist || true
            if [ "$RC" -eq 0 ]; then
              echo "=== artifact arch check ==="
              readelf -h dist/RaccoonX-Linux/dbcheck | grep -E "Class:|Machine:" || true
              ls -lh dist/RaccoonX-Linux-*.tar.gz
            fi
            exit $RC
          '

      - name: Extract error snippet
        if: failure()
        run: |
          SNIP=$(grep -aiE "error|failed|Traceback|No matching|Unable to find" build-linux-arm64.log \
            | tail -3 | tr -d '\r' | tr '\n' '|' | tr -c 'a-zA-Z0-9 |._-' ' ' | cut -c1-160)
          echo "snippet: $SNIP"
          # 匿名访问 job 日志会返回 403，关键日志行以 annotation 输出，无需登录即可定位首因。
          if [ -n "$SNIP" ]; then echo "::error::Linux arm64 build failed: $SNIP"; fi
          if [ -f build-linux-arm64.log ]; then
            grep -aiE "error|fail|traceback|exception|No matching|Could not|Missing" build-linux-arm64.log 2>/dev/null \
              | tail -20 | cut -c1-200 | while IFS= read -r line; do
                s=$(printf '%s' "$line" | tr -c 'a-zA-Z0-9 |._\-/:()=<>' ' ')
                echo "::error::LOG: $s"
              done
          fi
          {
            echo "## Linux arm64 试跑失败摘要"
            echo ""
            echo '```'
            echo "$SNIP"
            echo '```'
            if [ -f build/core-missing.txt ]; then
              echo ""
              echo "### 缺失的核心模块"
              echo ""
              echo '```'
              cat build/core-missing.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-arm64
          path: |
            build-linux-arm64.log
            build/core-missing.txt
          if-no-files-found: warn
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/RaccoonX-Linux-aarch64-*.tar.gz
          if-no-files-found: error
