name: Build & Push Multi-arch Docker Image

# 多架构（amd64 + arm64）镜像构建流程。
# 触发: 推送 v* tag，或手动 workflow_dispatch。
# 说明: 原生 arm64 镜像解决了 ARM64 信创主机（鲲鹏/飞腾）上旧 amd64-only 镜像
#       因 qemu 仿真导致 numpy "X86_V2 unsupported" 崩溃的问题。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v26.9.8.0)。留空则从 modules/config/version.py 读取'
        required: false
        default: ''
      full:
        description: '构建全量版（含 DM8）'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    # 已恢复：仅 Docker 镜像走 CI 自动构建并推送（GHCR + Docker Hub）。
    # 注意：manylinux 二进制包仍按 build-release.yml 的 build-linux: if:false 保持屏蔽，
    # 两者独立——Docker 镜像基于 python:3.12-slim-bookworm + apt 装系统库，不受 manylinux 缺 jpeg 编译问题影响。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(grep -m1 '__version__' modules/config/version.py | sed -E "s/.*=[[:space:]]*['\"]//; s/['\"].*//")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 注: 全量版（含 DM8）请用 scripts/build-multiarch.sh --full --push；
          #     CI 默认构建基础版（base image）。
          build-args: |
            DBCHECK_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/fiyo/dbcheck:${{ steps.version.outputs.version }}
            ghcr.io/fiyo/dbcheck:latest
            ${{ secrets.DOCKERHUB_TOKEN != '' && format('jackge12345/dbcheck:{0}', steps.version.outputs.version) || '' }}
            ${{ secrets.DOCKERHUB_TOKEN != '' && 'jackge12345/dbcheck:latest' || '' }}
