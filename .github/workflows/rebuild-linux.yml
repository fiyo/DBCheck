name: Rebuild Linux Binary

# 仅用于「其它平台包已在 Release 中，单独补一个 Linux 包」的场景。
# 触发：GitHub Actions 页面 → Rebuild Linux Binary → Run workflow
#   - version：要挂载到的已有 Release 标签（默认 v26.11.13.1）
# 该 workflow 不重建 Windows / macOS，也不会重复追加安装说明，
# 仅把新构建的 Linux 包用 gh release upload 追加（--clobber 覆盖同名）到指定 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target Release tag to attach the Linux binary to, e.g. v26.11.13.1"
        required: true
        default: "v26.11.14.0"

permissions:
  contents: write

env:
  PY_VERSION: "3.11"
  DBCHECK_CI_LENIENT: "1"

jobs:
  build-linux:
    name: Build Linux x86_64 (manylinux_2_28 / glibc 2.28)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # 与 build-release.yml 的 build-linux 保持同一套构建链（manylinux_2_28 / glibc 2.28）。
      - name: Build in manylinux_2_28 container
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e DBCHECK_CI_LENIENT=1 \
            quay.io/pypa/manylinux_2_28_x86_64 bash -c '
            set -e
            # 与 build-release.yml 一致：manylinux 自带 CPython 是 --disable-shared，
            # PyInstaller 需要 libpython.so，改用 EL8 系统 Python 3.11（shared build）。
            dnf install -y --setopt=install_weak_deps=False \
                java-11-openjdk-headless java-11-openjdk-devel \
                gcc gcc-c++ make libffi-devel openssl-devel \
                python3.11 python3.11-devel \
                unixODBC unixODBC-devel \
              || dnf --enablerepo="*" install -y --setopt=install_weak_deps=False \
                java-11-openjdk-headless java-11-openjdk-devel \
                gcc gcc-c++ make libffi-devel openssl-devel \
                python3.11 python3.11-devel unixODBC unixODBC-devel
            dnf install -y python3.11-pip 2>&1 || echo "[warn] python3.11-pip unavailable; venv ensurepip will be used"
            ln -sf /usr/bin/python3.11 /usr/local/bin/python3
            export LD_LIBRARY_PATH="/usr/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            python3 --version
            ls -l /usr/lib64/libpython3.11.so* || echo "[warn] libpython3.11.so not found"
            python3 -m pip install --upgrade pip setuptools wheel --timeout 120 --retries 10 \
              2>&1 || echo "[warn] system pip unavailable, venv will bootstrap pip"
            dnf install -y libjpeg-turbo-devel zlib-devel libpng-devel freetype-devel \
                2>&1 || echo "[warn] optional image devel libs unavailable"
            export JAVA_HOME=/usr/lib/jvm/java-11-openjdk
            export PATH=$JAVA_HOME/bin:$PATH
            # workflow 顶层 env 不进 docker run，必须显式 -e 传宽松安装开关
            python3 build/ci_prepare.py
            bash build/build_linux.sh 2>&1 | tee build-linux.log
            RC=${PIPESTATUS[0]}
            chmod -R a+rwX /src/dist || true
            exit $RC
          '

      - name: Extract error snippet
        if: failure()
        run: |
          SNIP=$(grep -aiE "error|failed|Traceback|No matching|Unable to find" build-linux.log \
            | tail -3 | tr -d '\r' | tr '\n' '|' | tr -c 'a-zA-Z0-9 |._-' ' ' | cut -c1-160)
          echo "ERR_SNIPPET=$SNIP" >> "$GITHUB_ENV"
          echo "snippet: $SNIP"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ env.ERR_SNIPPET }}
          path: build-linux.log
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/RaccoonX-Linux-x86_64-*.tar.gz

  release:
    name: Attach Linux to Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version }}
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts/linux

      - name: Upload to existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh artifacts/linux
          gh release upload "$TAG" artifacts/linux/*.tar.gz --clobber
