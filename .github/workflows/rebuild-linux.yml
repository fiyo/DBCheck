name: Rebuild Linux Binary

# 仅用于「其它平台包已在 Release 中，单独补一个 Linux 包」的场景。
# 触发：GitHub Actions 页面 → Rebuild Linux Binary → Run workflow
#   - version：要挂载到的已有 Release 标签（默认 v26.9.3.0）
# 该 workflow 不重建 Windows / macOS，也不会重复追加安装说明，
# 仅把新构建的 Linux 包用 gh release upload 追加（--clobber 覆盖同名）到指定 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target Release tag to attach the Linux binary to, e.g. v26.9.3.0"
        required: true
        default: "v26.9.4.0"

permissions:
  contents: write

# 临时屏蔽：与 build-release.yml 的 Linux 构建一并停用（manylinux 容器内 Pillow/JPype1
# 源码编译缺 jpeg 等系统库持续失败）。恢复时删除下面这行 `if: false` 即可重新启用单独补 Linux 包的能力。
if: false

env:
  PY_VERSION: "3.11"
  DBCHECK_CI_LENIENT: "1"

jobs:
  build-linux:
    name: Build Linux (manylinux2014 / glibc 2.17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # 在 manylinux2014 容器内构建，产物兼容 CentOS 7 / RHEL 7 (glibc 2.17)
      - name: Build in manylinux2014 container
        run: |
          docker run --rm -v "$PWD":/src -w /src quay.io/pypa/manylinux2014_x86_64 bash -c '
            set -e
            PYBIN=$(ls -d /opt/python/cp311-cp311 2>/dev/null || ls -d /opt/python/cp310-cp310 2>/dev/null || ls -d /opt/python/cp3*-cp3* 2>/dev/null | sort | tail -1)
            echo "Using manylinux Python: $PYBIN"
            ln -sf "$PYBIN/bin/python3" /usr/local/bin/python3
            ln -sf "$PYBIN/bin/pip" /usr/local/bin/pip
            python3 -m pip install --upgrade pip setuptools wheel
            yum install -y libffi-devel openssl-devel postgresql-devel \
                libjpeg-turbo-devel zlib-devel libpng-devel freetype-devel \
                libtiff-devel lcms2-devel libwebp-devel openjpeg2-devel \
                java-11-openjdk java-11-openjdk-devel ant \
                python3-libs python3-devel \
                gcc gcc-c++ make cmake ninja-build cython pkgconfig \
                2>&1 || echo "[warn] some yum packages failed to install"
            export JAVA_HOME=/usr/lib/jvm/java-11-openjdk
            export PATH=$JAVA_HOME/bin:$PATH
            python3 build/ci_prepare.py
            bash build/build_linux.sh 2>&1 | tee build-linux.log
            RC=${PIPESTATUS[0]}
            chmod -R a+rwX /src/dist || true
            exit $RC
          '

      - name: Extract error snippet
        if: failure()
        run: |
          SNIP=$(grep -aiE "error|failed|Traceback|No matching|Unable to find" build-linux.log \
            | tail -3 | tr -d '\r' | tr '\n' '|' | tr -c 'a-zA-Z0-9 |._-' ' ' | cut -c1-160)
          echo "ERR_SNIPPET=$SNIP" >> "$GITHUB_ENV"
          echo "snippet: $SNIP"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ env.ERR_SNIPPET }}
          path: build-linux.log
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/RaccoonX-Linux-x86_64-*.tar.gz

  release:
    name: Attach Linux to Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version }}
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts/linux

      - name: Upload to existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh artifacts/linux
          gh release upload "$TAG" artifacts/linux/*.tar.gz --clobber
