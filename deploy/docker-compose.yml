version: "3.8"

services:
  dbcheck:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # 自定义版本号可在此传参（不传则使用 Dockerfile 内 ARG DBCHECK_VERSION 默认值）：
      # args: { DBCHECK_VERSION: "v26.9.8.0" }
    image: jackge12345/dbcheck:latest
    container_name: dbcheck
    restart: unless-stopped
    ports:
      - "5003:5003"
    volumes:
      # Persist SQLite databases and config
      - dbcheck_data:/app/data
      # Persist pro_data (RBAC users.db, um_rbac.db)
      - dbcheck_pro_data:/app/data/pro_data
      # Persist generated reports
      - dbcheck_reports:/app/data/reports
      # 注意：不要挂载本地 drivers 目录覆盖镜像内置 drivers，否则 Oracle/DM8 等
      # 所需的 JDBC 驱动会被不完整的本地目录覆盖而失效。镜像构建时已烤入全部 drivers。
    environment:
      - TZ=Asia/Shanghai
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dbcheck_net

volumes:
  dbcheck_data:
  dbcheck_pro_data:
  dbcheck_reports:

networks:
  dbcheck_net:
    driver: bridge
