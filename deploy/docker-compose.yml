version: "3.8"

services:
  dbcheck:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # 自定义版本号可在此传参（不传则使用 Dockerfile 内 ARG DBCHECK_VERSION 默认值）：
      # args: { DBCHECK_VERSION: "v26.9.24.2" }
    image: jackge12345/dbcheck:latest
    container_name: dbcheck
    restart: unless-stopped
    ports:
      - "5003:5003"
    volumes:
      # Persist SQLite databases and config
      - dbcheck_data:/app/data
      # Persist pro_data (RBAC users.db, um_rbac.db)
      - dbcheck_pro_data:/app/data/pro_data
      # Persist generated reports
      - dbcheck_reports:/app/data/reports
      # 注意：不要挂载本地 drivers 目录覆盖镜像内置 drivers，否则 Oracle/DM8 等
      # 所需的 JDBC 驱动会被不完整的本地目录覆盖而失效。镜像构建时已烤入全部 drivers。
    environment:
      - TZ=Asia/Shanghai
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      # OpenBLAS 线程池护栏：受限容器（安全容器/定制 seccomp/LXC）里 clone() 被拦，
      # numpy 导入时 OpenBLAS 建 BLAS 线程会报 "pthread_create failed ...
      # Operation not permitted" 而崩溃。镜像内已默认 =1，此处显式声明便于按需调高
      # （如 CPU 空闲且无安全限制时可改 4）。
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dbcheck_net

volumes:
  dbcheck_data:
  dbcheck_pro_data:
  dbcheck_reports:

networks:
  dbcheck_net:
    driver: bridge
